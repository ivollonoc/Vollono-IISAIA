<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datos de nacimiento — Selección</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important; /* Cero redondeo estricto */
    }

    body {
      background-color: #b0b0b0;
      font-family: "Courier New", Courier, monospace;
      color: #000000;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 920px;
      background-color: #d4d0c8;
      border: 3px solid #000000;
      box-shadow: 6px 6px 0px #000000;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* HEADER */
    header {
      border: 2px solid #808080;
      border-top-color: #ffffff;
      border-left-color: #ffffff;
      background-color: #e4e0d8;
      padding: 10px;
    }

    .app__titulo {
      font-size: 15px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px dashed #808080;
      padding-bottom: 6px;
      margin-bottom: 6px;
    }

    .progreso {
      font-size: 12px;
    }

    /* MAIN: fila de ruedas. Fecha agrupada a la izquierda, país contra el borde derecho. */
    main {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: flex-start;
      border: 2px solid #808080;
      border-top-color: #ffffff;
      border-left-color: #ffffff;
      background-color: #cfcbc3;
      padding: 14px;
    }

    /* Cada rueda: pila vertical. El botón "Confirmar" va abajo de todo. */
    .rueda {
      border: 2px solid #000000;
      background-color: #d4d0c8;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: stretch;
      width: 160px;
    }

    .rueda--activa {
      outline: 2px solid #000000;
      outline-offset: 1px;
    }

    .rueda__nombre {
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
      background-color: #808080;
      color: #ffffff;
      padding: 3px 4px;
      letter-spacing: 1px;
    }

    .rueda--activa .rueda__nombre {
      background-color: #000000;
    }

    /* País: mismo trámite viejo, otra tinta. El color dice "otro tipo de dato". */
    .rueda--pais {
      width: 240px;
      margin-left: auto; /* la separa del grupo de fecha y la manda a la derecha */
      border-color: #2f4f6f;
      background-color: #cdd7df;
    }

    .rueda--pais .rueda__nombre {
      background-color: #2f4f6f;
    }

    .rueda--pais.rueda--activa {
      outline-color: #2f4f6f;
    }

    .rueda--pais.rueda--activa .rueda__nombre {
      background-color: #16324a;
    }

    .flecha {
      font-family: inherit;
      font-size: 12px;
      line-height: 1;
      border: 2px solid #000000;
      background-color: #e4e0d8;
      cursor: pointer;
      padding: 3px 0;
    }

    .flecha:active {
      background-color: #b8b4ac;
    }

    .flecha:disabled {
      color: #888888;
      cursor: default;
    }

    .ventana {
      border: 2px solid #000000;
      border-top-color: #888888;
      border-left-color: #888888;
      background-color: #ffffff;
      padding: 10px 12px;
      text-align: center;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden; /* una sola opción, sin asomar las de al lado */
    }

    /* La ventana de país acepta dos renglones: sigue siendo UNA opción, más larga. */
    .rueda--pais .ventana {
      white-space: normal;
      font-size: 13px;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contador {
      font-size: 10px;
      text-align: center;
      color: #333333;
    }

    .confirmar {
      font-family: inherit;
      font-size: 11px;
      border: 2px solid #000000;
      background-color: #e4e0d8;
      cursor: pointer;
      padding: 5px 6px;
    }

    .confirmar:active {
      background-color: #b8b4ac;
    }

    .rueda__confirmado {
      font-size: 10px;
      word-break: break-word;
    }

    /* Buscador de país: campo de texto + desplegable que se superpone. */
    .pais-buscador {
      position: relative;
    }

    .pais-input {
      font-family: inherit;
      font-size: 12px;
      width: 100%;
      border: 2px solid #000000;
      border-top-color: #888888;
      border-left-color: #888888;
      background-color: #ffffff;
      padding: 5px 6px;
    }

    .pais-desplegable {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 20;
      list-style: none;
      border: 2px solid #000000;
      background-color: #ffffff;
      max-height: 220px;
      overflow-y: auto;
    }

    .pais-opcion {
      padding: 5px 6px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 1px solid #cccccc;
    }

    .pais-opcion:last-child {
      border-bottom: 0;
    }

    .pais-opcion:hover {
      background-color: #2f4f6f;
      color: #ffffff;
    }

    /* FOOTER */
    footer {
      border: 2px solid #808080;
      border-top-color: #ffffff;
      border-left-color: #ffffff;
      background-color: #e4e0d8;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .footer__confirmados {
      font-size: 12px;
      white-space: pre-line;
    }

    .footer__resumen {
      font-size: 13px;
      font-weight: bold;
      border: 2px solid #000000;
      background-color: #ffffff;
      padding: 8px;
    }

    #continuar {
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 2px solid #000000;
      background-color: #c8c4bc;
      cursor: pointer;
      padding: 8px 14px;
      align-self: flex-start;
    }

    #continuar:disabled {
      color: #888888;
      cursor: default;
      background-color: #d8d4cc;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="app__titulo">Datos de nacimiento</div>
      <div class="progreso" id="progreso" aria-live="polite">0 de 4 datos confirmados</div>
    </header>

    <main id="ruedas"></main>

    <footer>
      <div class="footer__confirmados" id="confirmados"></div>
      <div class="footer__resumen" id="resumen" hidden></div>
      <button id="continuar" type="button" disabled>Continuar</button>
    </footer>
  </div>

  <script>
    (function () {
      "use strict";

      var COOLDOWN = 250; // ms de enfriamiento entre pasos: mantener apretado no acelera
      var PAIS_IDX = 3;   // índice de la rueda de país dentro de estado.ruedas

      function rango(desde, hasta) {
        var a = [];
        for (var i = desde; i <= hasta; i++) a.push(String(i));
        return a;
      }

      // Lista escrita a mano, 194 nombres en español. Se ordena en runtime.
      var PAISES = [
        "Afganistán", "Albania", "Alemania", "Andorra", "Angola",
        "Antigua y Barbuda", "Arabia Saudita", "Argelia", "Argentina", "Armenia",
        "Australia", "Austria", "Azerbaiyán", "Bahamas", "Bangladés",
        "Barbados", "Baréin", "Bélgica", "Belice", "Benín",
        "Bielorrusia", "Birmania", "Bolivia", "Bosnia y Herzegovina", "Botsuana",
        "Brasil", "Brunéi", "Bulgaria", "Burkina Faso", "Burundi",
        "Bután", "Cabo Verde", "Camboya", "Camerún", "Canadá",
        "Catar", "Chad", "Chile", "China", "Chipre",
        "Ciudad del Vaticano", "Colombia", "Comoras", "Corea del Norte", "Corea del Sur",
        "Costa de Marfil", "Costa Rica", "Croacia", "Cuba", "Dinamarca",
        "Dominica", "Ecuador", "Egipto", "El Salvador", "Emiratos Árabes Unidos",
        "Eritrea", "Eslovaquia", "Eslovenia", "España", "Estados Unidos",
        "Estonia", "Esuatini", "Etiopía", "Filipinas", "Finlandia",
        "Fiyi", "Francia", "Gabón", "Gambia", "Georgia",
        "Ghana", "Granada", "Grecia", "Guatemala", "Guinea",
        "Guinea-Bisáu", "Guinea Ecuatorial", "Guyana", "Haití", "Honduras",
        "Hungría", "India", "Indonesia", "Irak", "Irán",
        "Irlanda", "Islandia", "Islas Marshall", "Islas Salomón", "Israel",
        "Italia", "Jamaica", "Japón", "Jordania", "Kazajistán",
        "Kenia", "Kirguistán", "Kiribati", "Kuwait", "Laos",
        "Lesoto", "Letonia", "Líbano", "Liberia", "Libia",
        "Liechtenstein", "Lituania", "Luxemburgo", "Macedonia del Norte", "Madagascar",
        "Malasia", "Malaui", "Maldivas", "Malí", "Malta",
        "Marruecos", "Mauricio", "Mauritania", "México", "Micronesia",
        "Moldavia", "Mónaco", "Mongolia", "Montenegro", "Mozambique",
        "Namibia", "Nauru", "Nepal", "Nicaragua", "Níger",
        "Nigeria", "Noruega", "Nueva Zelanda", "Omán", "Países Bajos",
        "Pakistán", "Palaos", "Panamá", "Papúa Nueva Guinea", "Paraguay",
        "Perú", "Polonia", "Portugal", "Reino Unido", "República Centroafricana",
        "República Checa", "República del Congo", "República Democrática del Congo",
        "República Dominicana", "Ruanda", "Rumania", "Rusia", "Samoa",
        "San Cristóbal y Nieves", "San Marino", "San Vicente y las Granadinas",
        "Santa Lucía", "Santo Tomé y Príncipe", "Senegal", "Serbia", "Seychelles",
        "Sierra Leona", "Singapur", "Siria", "Somalia", "Sri Lanka",
        "Sudáfrica", "Sudán", "Sudán del Sur", "Suecia", "Suiza",
        "Surinam", "Tailandia", "Tanzania", "Tayikistán", "Timor Oriental",
        "Togo", "Tonga", "Trinidad y Tobago", "Túnez", "Turkmenistán",
        "Turquía", "Tuvalu", "Ucrania", "Uganda", "Uruguay",
        "Uzbekistán", "Vanuatu", "Venezuela", "Vietnam", "Yemen",
        "Yibuti", "Zambia", "Zimbabue"
      ].sort(function (a, b) { return a.localeCompare(b, "es"); });

      var estado = {
        ruedas: [
          { nombre: "Día",  opciones: rango(1, 31),      indice: 0, confirmado: null },
          { nombre: "Mes",  opciones: rango(1, 12),      indice: 0, confirmado: null },
          { nombre: "Año",  opciones: rango(1920, 2010), indice: 0, confirmado: null },
          { nombre: "País", opciones: PAISES,            indice: 0, confirmado: null }
        ],
        activa: null,
        bloqueado: false,
        busquedaPais: "" // texto tipeado en el buscador de país, o ""
      };

      var resumenVisible = false;

      var contRuedas = document.getElementById("ruedas");
      var elProgreso = document.getElementById("progreso");
      var elConfirmados = document.getElementById("confirmados");
      var elResumen = document.getElementById("resumen");
      var btnContinuar = document.getElementById("continuar");

      function escapar(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }

      function normaliza(s) {
        s = String(s).toLowerCase();
        var con = "áàäâãéèëêíìïîóòöôõúùüû";
        var sin = "aaaaaeeeeiiiiooooouuuu";
        var out = "";
        for (var i = 0; i < s.length; i++) {
          var k = con.indexOf(s.charAt(i));
          out += (k === -1) ? s.charAt(i) : sin.charAt(k);
        }
        return out;
      }

      function todasConfirmadas() {
        return estado.ruedas.every(function (r) { return r.confirmado !== null; });
      }

      // Países cuyo nombre empieza con lo tipeado (sin mayúsculas ni acentos). Máx 8.
      function paisesFiltrados() {
        if (estado.busquedaPais === "") return [];
        var q = normaliza(estado.busquedaPais);
        var out = [];
        for (var i = 0; i < PAISES.length && out.length < 8; i++) {
          if (normaliza(PAISES[i]).indexOf(q) === 0) out.push(PAISES[i]);
        }
        return out;
      }

      function paso(i, dir) {
        if (estado.bloqueado) return;
        var r = estado.ruedas[i];
        var n = r.opciones.length;
        estado.activa = i;
        r.indice = (r.indice + dir + n) % n; // wrap-around al llegar al extremo
        estado.bloqueado = true;
        render();
        setTimeout(function () {
          estado.bloqueado = false;
          render();
        }, COOLDOWN);
      }

      // Elegir del desplegable: mueve indice, NO toca confirmado, NO usa el enfriamiento.
      function seleccionarPais(nombre) {
        var idx = PAISES.indexOf(nombre);
        if (idx === -1) return;
        estado.ruedas[PAIS_IDX].indice = idx;
        estado.activa = PAIS_IDX;
        estado.busquedaPais = "";
        render();
      }

      function confirmar(i) {
        var r = estado.ruedas[i];
        r.confirmado = r.opciones[r.indice];
        estado.activa = i;
        resumenVisible = false;
        render();
      }

      function continuar() {
        if (!todasConfirmadas()) return;
        resumenVisible = true;
        render();
      }

      function ruedaHTML(r, i) {
        var total = r.opciones.length;
        var esPais = (i === PAIS_IDX);
        var clases = "rueda";
        if (esPais) clases += " rueda--pais";
        if (estado.activa === i) clases += " rueda--activa";
        var conf = r.confirmado === null ? "sin confirmar" : escapar(r.confirmado);

        var buscador = "";
        if (esPais) {
          var lista = paisesFiltrados();
          var desplegable = "";
          if (estado.busquedaPais !== "" && lista.length > 0) {
            desplegable = '<ul class="pais-desplegable">' + lista.map(function (p) {
              return '<li class="pais-opcion" data-pais="' + escapar(p) + '">' + escapar(p) + "</li>";
            }).join("") + "</ul>";
          }
          buscador =
            '<div class="pais-buscador">' +
              '<input class="pais-input" type="text" autocomplete="off" spellcheck="false" ' +
                'placeholder="escribir país…" aria-label="Buscar país" ' +
                'value="' + escapar(estado.busquedaPais) + '">' +
              desplegable +
            "</div>";
        }

        return "" +
          '<section class="' + clases + '">' +
            '<div class="rueda__nombre">' + escapar(r.nombre) + "</div>" +
            buscador +
            '<button class="flecha" type="button" data-idx="' + i + '" data-dir="-1" ' +
              'aria-label="Opción anterior de ' + escapar(r.nombre) + '">&#9650;</button>' +
            '<div class="ventana"><span class="ventana__valor">' +
              escapar(r.opciones[r.indice]) + "</span></div>" +
            '<div class="contador">opción ' + (r.indice + 1) + " de " + total + "</div>" +
            '<button class="flecha" type="button" data-idx="' + i + '" data-dir="1" ' +
              'aria-label="Opción siguiente de ' + escapar(r.nombre) + '">&#9660;</button>' +
            '<button class="confirmar" type="button" data-confirmar="' + i + '">Confirmar</button>' +
            '<div class="rueda__confirmado">' + conf + "</div>" +
          "</section>";
      }

      function render() {
        contRuedas.innerHTML = estado.ruedas.map(ruedaHTML).join("");

        contRuedas.querySelectorAll(".flecha").forEach(function (b) {
          if (estado.bloqueado) b.disabled = true;
          b.addEventListener("click", function () {
            paso(parseInt(b.getAttribute("data-idx"), 10), parseInt(b.getAttribute("data-dir"), 10));
          });
        });

        contRuedas.querySelectorAll(".confirmar").forEach(function (b) {
          b.addEventListener("click", function () {
            confirmar(parseInt(b.getAttribute("data-confirmar"), 10));
          });
        });

        contRuedas.querySelectorAll(".pais-opcion").forEach(function (li) {
          li.addEventListener("click", function () {
            seleccionarPais(li.getAttribute("data-pais"));
          });
        });

        var input = contRuedas.querySelector(".pais-input");
        if (input) {
          input.addEventListener("input", function () {
            var pos = input.selectionStart;
            estado.busquedaPais = input.value;
            estado.activa = PAIS_IDX;
            render();
            var nuevo = contRuedas.querySelector(".pais-input");
            if (nuevo) {
              nuevo.focus();
              try { nuevo.setSelectionRange(pos, pos); } catch (e) {}
            }
          });
        }

        var hechas = estado.ruedas.filter(function (r) { return r.confirmado !== null; }).length;
        elProgreso.textContent = hechas + " de 4 datos confirmados";

        elConfirmados.textContent = estado.ruedas.map(function (r) {
          return r.nombre + ": " + (r.confirmado === null ? "—" : r.confirmado);
        }).join("\n");

        btnContinuar.disabled = !todasConfirmadas();

        if (resumenVisible && todasConfirmadas()) {
          var v = {};
          estado.ruedas.forEach(function (r) { v[r.nombre] = r.confirmado; });
          elResumen.textContent =
            "Fecha de nacimiento: " + v["Día"] + "/" + v["Mes"] + "/" + v["Año"] +
            "   ·   País de nacimiento: " + v["País"];
          elResumen.hidden = false;
        } else {
          elResumen.hidden = true;
        }
      }

      btnContinuar.addEventListener("click", continuar);

      render();
    })();
  </script>
</body>
</html>
